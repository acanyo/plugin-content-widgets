plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'com.xhhao.contentwidgets'

repositories {
    mavenCentral()
    maven { url = uri('https://central.sonatype.com/repository/maven-snapshots/') }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.24.0')
    compileOnly 'run.halo.app:api'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'
    // Provided at runtime by the optional MCP Server plugin.
    compileOnly 'run.halo.mcpserver:api:1.2.0'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'run.halo.mcpserver:api:1.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

// Widget manifest generated by pnpm from ui/src/editor/widgets; consumed by the MCP tools.
def generatedManifestDir = layout.buildDirectory.dir('generated/resources/manifest')

tasks.register('processWidgetManifest', Copy) {
    from project(':ui').layout.buildDirectory.file('manifest/content-widgets-manifest.json')
    into generatedManifestDir
    dependsOn ':ui:pnpmGenerateManifest'
}

sourceSets.main.resources.srcDir generatedManifestDir
processResources.dependsOn processWidgetManifest

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.24'
}

